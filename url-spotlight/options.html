<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Spotlight Options</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2b2f3a;
      color: #e8eaed;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: #1f232d;
      border: 1px solid #3a3f4b;
      border-radius: 12px;
      padding: 28px 32px;
      width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p.sub { margin: 0 0 20px; color: #9aa0aa; font-size: 12px; }
    label { display: block; margin-bottom: 8px; color: #c4c9d2; font-size: 12px; }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3a3f4b;
      background: #2b2f3a;
      color: #e8eaed;
      font-size: 14px;
      outline: none;
    }
    select:focus { border-color: #5b8cff; }
    .status {
      margin-top: 14px;
      height: 16px;
      font-size: 12px;
      color: #6bd08a;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>URL Spotlight</h1>
    <p class="sub">Default search engine</p>
    <label for="engine">Search with</label>
    <select id="engine"></select>
    <div class="status" id="status">Saved</div>
  </div>
  <script src="options.js"></script>
  <script src="content.js"></script>
</body>
</html>
