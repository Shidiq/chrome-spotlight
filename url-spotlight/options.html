<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Spotlight Options</title>
  <style>
    :root {
      --sp-page-bg: #2b2f3a;
      --sp-text: #e8eaed;
      --sp-card-bg: #1f232d;
      --sp-card-border: #3a3f4b;
      --sp-card-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      --sp-sub: #9aa0aa;
      --sp-label: #c4c9d2;
      --sp-accent: #5b8cff;
      --sp-success: #6bd08a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --sp-page-bg: #eef1f6;
        --sp-text: #1a1a1a;
        --sp-card-bg: #ffffff;
        --sp-card-border: #d6dae2;
        --sp-card-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        --sp-sub: #6b7280;
        --sp-label: #3a4150;
        --sp-success: #1e9e54;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--sp-page-bg);
      color: var(--sp-text);
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: var(--sp-card-bg);
      border: 1px solid var(--sp-card-border);
      border-radius: 12px;
      padding: 28px 32px;
      width: 360px;
      box-shadow: var(--sp-card-shadow);
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p.sub { margin: 0 0 20px; color: var(--sp-sub); font-size: 12px; }
    label { display: block; margin-bottom: 8px; color: var(--sp-label); font-size: 12px; }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--sp-card-border);
      background: var(--sp-page-bg);
      color: var(--sp-text);
      font-size: 14px;
      outline: none;
    }
    select:focus { border-color: var(--sp-accent); }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      color: var(--sp-label);
      font-size: 13px;
      cursor: pointer;
    }
    .toggle-row input { width: 16px; height: 16px; accent-color: var(--sp-accent); cursor: pointer; }
    .status {
      margin-top: 14px;
      height: 16px;
      font-size: 12px;
      color: var(--sp-success);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>URL Spotlight</h1>
    <p class="sub">Default search engine</p>
    <label for="engine">Search with</label>
    <select id="engine"></select>
    <label class="toggle-row" for="loadingAnim">
      <span>Page loading animation</span>
      <input type="checkbox" id="loadingAnim">
    </label>
    <div class="status" id="status">Saved</div>
  </div>
  <script src="options.js"></script>
  <script src="content.js"></script>
</body>
</html>
