<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #0a0e1c;
    }
    /* Aurora: layered radial glows, heavily blurred. Deliberately static — see
       the note by will-change below. */
    body::before {
      content: "";
      position: fixed;
      /* Bleed just past the viewport so the 70px blur doesn't fade at the
         edges. It used to be -25% to hide the drift's rotate/scale corners;
         without those, -10% is enough, and the layer is ~40% smaller. */
      inset: -10%;
      z-index: 0;
      background:
        radial-gradient(ellipse 55% 45% at 18% 28%, rgba(56, 189, 248, 0.42), transparent 62%),
        radial-gradient(ellipse 50% 55% at 82% 18%, rgba(139, 92, 246, 0.38), transparent 62%),
        radial-gradient(ellipse 60% 45% at 62% 82%, rgba(45, 212, 191, 0.30), transparent 62%),
        radial-gradient(ellipse 40% 40% at 38% 62%, rgba(236, 72, 153, 0.16), transparent 60%),
        radial-gradient(ellipse 45% 35% at 90% 70%, rgba(59, 130, 246, 0.22), transparent 60%);
      filter: blur(70px) saturate(1.2);
      /* This used to drift on a 45s infinite alternate. Two things made that
         expensive enough to peg a core for as long as the tab was open:
         the keyframes changed scale/rotate, so the blurred layer could not be
         reused as a cached texture and was re-rasterised every frame (a 70px
         blur over ~1.5 viewports); and .sp-card's backdrop-filter had to
         re-blur its backdrop every frame too, once per card. Static, both are
         paid once. prefers-reduced-motion already rendered it this way. */
      /* Keeps the glow on its own compositor layer so unrelated repaints (the
         clock ticking each second) can't invalidate the blur. */
      will-change: transform;
    }
    /* Faint grain-less vignette keeps card edges and clock readable. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 120% 100% at 50% 0%, transparent 60%, rgba(4, 6, 14, 0.45));
      pointer-events: none;
    }
    @media (prefers-color-scheme: light) {
      body { background: #eef2f9; }
      body::before {
        background:
          radial-gradient(ellipse 55% 45% at 18% 28%, rgba(125, 211, 252, 0.55), transparent 62%),
          radial-gradient(ellipse 50% 55% at 82% 18%, rgba(196, 181, 253, 0.50), transparent 62%),
          radial-gradient(ellipse 60% 45% at 62% 82%, rgba(153, 246, 228, 0.45), transparent 62%),
          radial-gradient(ellipse 40% 40% at 38% 62%, rgba(251, 207, 232, 0.35), transparent 60%),
          radial-gradient(ellipse 45% 35% at 90% 70%, rgba(147, 197, 253, 0.35), transparent 60%);
      }
      body::after {
        background: radial-gradient(ellipse 120% 100% at 50% 0%, transparent 65%, rgba(255, 255, 255, 0.35));
      }
    }
  </style>
  <link rel="stylesheet" href="widgets.css">
</head>
<body>
  <div id="sp-widgets"></div>
  <script src="gcal.js"></script>
  <script src="widgets.js"></script>
  <script src="loader.js"></script>
  <script src="query.js"></script>
  <script src="content.js"></script>
</body>
</html>
