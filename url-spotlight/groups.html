<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --sp-bg: rgba(40, 40, 44, 1);
      --sp-text: #ffffff;
      --sp-text-secondary: #e0e0e0;
      --sp-muted: rgba(235, 235, 245, 0.6);
      --sp-placeholder: rgba(235, 235, 245, 0.35);
      --sp-border: rgba(255, 255, 255, 0.1);
      --sp-accent: #3b82f6;
      --sp-on-accent: #ffffff;
      --sp-badge-bg: rgba(255, 255, 255, 0.1);
      --sp-badge-tab-bg: rgba(59, 130, 246, 0.28);
      --sp-badge-tab-text: #9cc2ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --sp-bg: rgb(238, 238, 240);
        --sp-text: #1d1d1f;
        --sp-text-secondary: #1d1d1f;
        --sp-muted: #6e6e73;
        --sp-placeholder: #a1a1a6;
        --sp-border: rgba(0, 0, 0, 0.08);
        --sp-accent: #3478f6;
        --sp-on-accent: #ffffff;
        --sp-badge-bg: rgba(0, 0, 0, 0.07);
        --sp-badge-tab-bg: rgba(52, 120, 246, 0.12);
        --sp-badge-tab-text: #3478f6;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--sp-bg);
      color: var(--sp-text);
      width: 320px;
      max-height: 480px;
      overflow-y: auto;
      margin: 0;
      padding: 6px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .row:hover { background: var(--sp-badge-bg); }
    .row.selected { background: var(--sp-accent); }
    .row.selected .title,
    .row.selected .count,
    .row.selected .win { color: var(--sp-on-accent); }
    .row.selected .count { background: rgba(255, 255, 255, 0.2); }
    .row.selected .dot { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7); }
    .dot {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title.untitled {
      font-style: italic;
      color: var(--sp-muted);
    }
    .count {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--sp-badge-bg);
      color: var(--sp-muted);
      white-space: nowrap;
    }
    .win {
      flex: 0 0 auto;
      font-size: 11px;
      color: var(--sp-muted);
      white-space: nowrap;
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--sp-muted);
      padding: 8px 10px 4px;
    }
    .row.closed .dot { opacity: 0.55; }
    .row.closed .title { color: var(--sp-text-secondary); }
    .row.closed.selected .title { color: var(--sp-on-accent); }
    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--sp-muted);
      font-size: 13px;
    }
    .empty .hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--sp-placeholder);
    }
  </style>
</head>
<body>
  <div id="list"></div>
  <script src="tabgroups.js"></script>
  <script src="groups.js"></script>
</body>
</html>
